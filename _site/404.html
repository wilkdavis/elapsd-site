<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Oops! Not Found</title>
  <meta name="description" content="A calm, simple time tracker for real life." />

  <!-- Open Graph (optional but nice for sharing) -->
  <meta property="og:title" content="Oops! Not Found" />
  <meta property="og:description" content="A calm, simple time tracker for real life." />
  <meta property="og:type" content="website" />

  <link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body>
  <header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="/">
      <img class="brand-logo" src="/assets/img/elapsed_logo_notext.png" alt="" aria-hidden="true" />
      <span class="brand-text">Elapsd</span>
    </a>

    <nav class="nav">
      <a href="/privacy/">Privacy</a>
      <a class="button" href="/contact/">Contact</a>
    </nav>
  </div>
</header>


  <main class="container">
    <article class="card">
      <h1>404 - Nothing Here</h1>
<p class="lead">
Oops!  Try going back to the <a href="/">home page</a>
</p>

    </article>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-dialog" role="dialog" aria-modal="true" aria-label="Expanded screenshot viewer">
      <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close screenshot viewer">Close</button>
      <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="Previous screenshot">Previous</button>
      <img class="lightbox-image" id="lightbox-image" src="" alt="" />
      <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="Next screenshot">Next</button>
    </div>
  </div>

  <footer class="footer">
  <div class="container footer-inner">
    <p class="muted">© 2026 Elapsd. Built with minimal fuss.</p>
  </div>
</footer>

  <script type="module" src="/assets/js/lightbox.js"></script>
</body>
